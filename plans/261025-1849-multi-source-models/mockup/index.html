<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Provider · Memory Hub (mockup)</title>
<!--
  Mockup tĩnh cho tab "Model Provider" của Memory Hub Panel (quản lý nhóm upstream tùy chỉnh).
  Không dùng tài nguyên mạng. Màu, cỡ chữ, khung trang lấy từ:
    MemoryPanel/web/src/index.css, src/tea-override.css,
    src/layouts/GlobalHeader/style.css, src/layouts/TabBar/style.css,
    src/pages/SubscriptionPoolPage/style.css,
    tea-component/dist/style/mixins/_var-color-light.scss (bảng màu Tea light).
  Mọi key trong tệp này là placeholder (sk-••••). Không có secret thật.
-->
<style>
/* ===== Tea Design tokens (light), chép từ _var-color-light.scss ===== */
:root {
  --tea-color-palette-blue-1: #e3ecff;
  --tea-color-palette-blue-7: #266fe8;
  --tea-color-palette-blue-8: #0052d9;
  --tea-color-palette-blue-9: #0034b5;
  --tea-color-palette-bluegray-1: #f2f4f8;
  --tea-color-palette-bluegray-2: #e9ecf1;
  --tea-color-palette-bluegray-3: #e6e9ef;
  --tea-color-palette-bluegray-4: #d6dbe3;
  --tea-color-palette-green-1: #e0f7eb;
  --tea-color-palette-green-8: #0cbf5b;
  --tea-color-palette-orange-1: #ffeddf;
  --tea-color-palette-orange-8: #ff7800;
  --tea-color-palette-red-1: #fce8e8;
  --tea-color-palette-red-8: #f64041;

  --tea-color-bg-brand-default: var(--tea-color-palette-blue-8);
  --tea-color-bg-brand-hover: var(--tea-color-palette-blue-7);
  --tea-color-bg-brand-active: var(--tea-color-palette-blue-9);
  --tea-color-bg-brand-lighten-default: var(--tea-color-palette-blue-1);
  --tea-color-bg-page-default: var(--tea-color-palette-bluegray-1);
  --tea-color-bg-primary-default: #fff;
  --tea-color-bg-secondary-default: var(--tea-color-palette-bluegray-1);
  --tea-color-bg-secondary-hover: var(--tea-color-palette-bluegray-2);
  --tea-color-bg-success-default: var(--tea-color-palette-green-8);
  --tea-color-bg-warning-default: var(--tea-color-palette-orange-8);
  --tea-color-bg-error-default: var(--tea-color-palette-red-8);
  --tea-color-text-primary: rgba(0, 0, 0, 0.9);
  --tea-color-text-secondary: rgba(0, 0, 0, 0.7);
  --tea-color-text-tertiary: rgba(0, 0, 0, 0.5);
  --tea-color-text-brand-default: var(--tea-color-palette-blue-8);
  --tea-color-text-link-default: var(--tea-color-palette-blue-8);
  /* Văn bản cảnh báo dùng tông cam đậm hơn orange-8 để đạt tỉ lệ tương phản 4.5:1 trên nền trắng. */
  --tea-color-text-warning-default: #b35400;
  --tea-color-text-success-default: #0a7f3f;
  --tea-color-text-error-default: #d32f30;
  --tea-color-border-primary-default: var(--tea-color-palette-bluegray-3);
  --tea-color-border-secondary-default: var(--tea-color-palette-bluegray-2);
  --tea-color-border-brand-default: var(--tea-color-palette-blue-8);
  --tea-shadow-xs: 0 1px 2px rgba(54, 58, 80, 0.08);
  --tea-form-height-default: 30px;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: Roboto, 'San Francisco', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--tea-color-bg-page-default);
  color: var(--tea-color-text-primary);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--tea-color-border-brand-default);
  outline-offset: 2px;
}
code, .mono { font-family: var(--font-mono); font-size: 12px; }

/* ===== App shell: GlobalHeader 48px + Sider 200px + Content ===== */
.shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.gh { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px;
  background: #fff; border-bottom: 1px solid var(--tea-color-border-primary-default); flex-shrink: 0; }
.gh-left, .gh-right { display: flex; align-items: center; gap: 12px; }
.gh-logo { width: 22px; height: 22px; border-radius: 4px; background: linear-gradient(135deg, #266fe8, #0034b5);
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.gh-brand { font-weight: 600; white-space: nowrap; }
.gh-divider { width: 1px; height: 20px; background: var(--tea-color-border-primary-default); }
.gh-team { font-size: 13px; color: var(--tea-color-text-secondary); }
.gh-sync { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--tea-color-text-secondary); }
.gh-sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--tea-color-bg-success-default); }
.gh-user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.gh-avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--tea-color-bg-brand-lighten-default);
  color: var(--tea-color-text-brand-default); display: grid; place-items: center; font-size: 12px; font-weight: 600; }

.body { display: flex; flex: 1; min-height: 0; }
.sider { width: 200px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--tea-color-border-primary-default);
  overflow-y: auto; padding: 8px 0; }
.menu-label { padding: 12px 16px 4px; font-size: 12px; color: var(--tea-color-text-tertiary); }
.menu-item { display: flex; align-items: center; gap: 8px; height: 36px; margin: 2px 8px; padding: 0 12px; border-radius: 6px;
  color: var(--tea-color-text-primary); cursor: pointer; font-size: 14px; border: 0; background: none; width: calc(100% - 16px); text-align: left; }
.menu-item:hover { background: var(--tea-color-bg-secondary-default); }
.menu-item.is-selected { background: var(--tea-color-bg-brand-default); color: #fff; }
.menu-item svg { flex-shrink: 0; }
.menu-new { margin-left: auto; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--tea-color-palette-orange-1); color: var(--tea-color-text-warning-default); }
.menu-item.is-selected .menu-new { background: rgba(255,255,255,.2); color: #fff; }

.content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tabbar { display: flex; align-items: center; height: 36px; padding: 0 8px; background: #fff;
  border-bottom: 1px solid var(--tea-color-border-primary-default); flex-shrink: 0; overflow-x: auto; }
.tabbar-item { display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; font-size: 12px;
  color: var(--tea-color-text-secondary); border-bottom: 2px solid transparent; border-radius: 4px 4px 0 0; flex-shrink: 0; }
.tabbar-item.is-active { color: var(--tea-color-text-primary); font-weight: 500; border-bottom-color: var(--tea-color-border-brand-default); }
.content-body { flex: 1; overflow-y: auto; padding: 16px; scrollbar-gutter: stable; }
.page { display: flex; flex-direction: column; gap: 16px; animation: page-enter .3s cubic-bezier(.16,1,.3,1); }
@keyframes page-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ===== Mockup-only: thanh chọn màn hình + ghi chú (không thuộc sản phẩm) ===== */
.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
  border: 1px dashed #b39ddb; background: #f6f2ff; font-size: 12px; }
.mock-bar b { color: #5e35b1; margin-right: 4px; }
.mock-bar button { height: 26px; padding: 0 10px; border: 1px solid #c9b8ef; background: #fff; border-radius: 13px; cursor: pointer; font-size: 12px; }
.mock-bar button.on { background: #5e35b1; border-color: #5e35b1; color: #fff; }
.mock-bar button:disabled { opacity: .45; cursor: not-allowed; }
.mock-role { margin-left: 8px; border-color: #c9b8ef; border-radius: 13px; align-items: center; background: #fff; }
.mock-role-label { padding: 0 6px 0 10px; color: #5e35b1; }
.mock-bar .mock-role button { height: 24px; border: 0; border-left: 1px solid #c9b8ef; border-radius: 0; padding: 0 10px; }
.mock-bar .mock-role button[aria-pressed='true'] { background: #5e35b1; color: #fff; }
.mock-bar label { margin-left: auto; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.note { border-left: 3px solid #f5b400; background: #fff8e1; padding: 6px 10px; font-size: 12px; color: #5d4300; }
.note::before { content: 'Ghi chú thiết kế · '; font-weight: 600; }
body.hide-notes .note { display: none; }

/* ===== Tea Card / Alert / Button / Tag / Switch / Table / Form ===== */
.card { background: #fff; border: 1px solid var(--tea-color-border-primary-default); box-shadow: var(--tea-shadow-xs); }
.card-body { padding: 20px 24px; }
.card-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.card-title { margin: 0; font-size: 14px; font-weight: 600; }
.card-sub { font-size: 12px; color: var(--tea-color-text-tertiary); margin-top: 2px; }
.card-op { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
h3.page-title { margin: 0; font-size: 16px; font-weight: 600; }
.page-head { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.weak { color: var(--tea-color-text-tertiary); }
.sec { color: var(--tea-color-text-secondary); }
.small { font-size: 12px; }

.alert { display: flex; gap: 8px; padding: 10px 16px; font-size: 13px; border: 1px solid; }
.alert::before { font-weight: 700; flex-shrink: 0; }
.alert-info { background: var(--tea-color-palette-blue-1); border-color: #bbd3fb; }
.alert-info::before { content: 'ⓘ'; color: var(--tea-color-text-brand-default); }
.alert-warning { background: var(--tea-color-palette-orange-1); border-color: #ffd0a8; }
.alert-warning::before { content: '⚠'; color: var(--tea-color-text-warning-default); }
.alert-error { background: var(--tea-color-palette-red-1); border-color: #f8bcbc; }
.alert-error::before { content: '✕'; color: var(--tea-color-text-error-default); }
.alert-success { background: var(--tea-color-palette-green-1); border-color: #a7e8c4; }
.alert-success::before { content: '✓'; color: var(--tea-color-text-success-default); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: var(--tea-form-height-default);
  min-width: 24px; padding: 0 20px; border: 1px solid var(--tea-color-palette-bluegray-4); background: #fff; border-radius: 3px;
  cursor: pointer; font-size: 12px; white-space: nowrap; transition: background-color .2s, border-color .2s, transform .15s; }
.btn:hover { border-color: #b7bfcc; background: var(--tea-color-bg-secondary-default); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--tea-color-bg-brand-default); border-color: var(--tea-color-bg-brand-default); color: #fff; }
.btn-primary:hover { background: var(--tea-color-bg-brand-hover); border-color: var(--tea-color-bg-brand-hover); }
.btn-error { color: var(--tea-color-text-error-default); border-color: #f8bcbc; }
.btn-error:hover { background: var(--tea-color-palette-red-1); border-color: var(--tea-color-text-error-default); }
.btn-danger { background: var(--tea-color-bg-error-default); border-color: var(--tea-color-bg-error-default); color: #fff; }
.btn-danger:hover { background: #d32f30; }
.btn-link { border: 0; background: none; padding: 0; height: auto; min-width: 0; color: var(--tea-color-text-link-default); margin-right: 8px; }
.btn-link:hover { background: none; color: var(--tea-color-bg-brand-hover); text-decoration: underline; }
.btn-link.danger { color: var(--tea-color-text-error-default); }
.btn-sm { height: 26px; padding: 0 12px; }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 12px; font-size: 12px;
  border: 1px solid var(--tea-color-palette-bluegray-4); background: var(--tea-color-bg-secondary-default); color: var(--tea-color-text-secondary); white-space: nowrap; }
.tag-primary { background: var(--tea-color-palette-blue-1); border-color: #bbd3fb; color: var(--tea-color-text-brand-default); }
.tag-success { background: var(--tea-color-palette-green-1); border-color: #a7e8c4; color: var(--tea-color-text-success-default); }
.tag-warning { background: var(--tea-color-palette-orange-1); border-color: #ffd0a8; color: var(--tea-color-text-warning-default); }
.tag-error { background: var(--tea-color-palette-red-1); border-color: #f8bcbc; color: var(--tea-color-text-error-default); }
.tag-sub { background: #f0e9ff; border-color: #d6c6fb; color: #5e35b1; }
.tag-api { background: #e5f6f7; border-color: #b2e2e6; color: #00737d; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }

.switch { position: relative; width: 35px; height: 20px; border-radius: 10px; border: 0; padding: 0; cursor: pointer;
  background: var(--tea-color-palette-bluegray-4); transition: background-color .2s; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
.switch[aria-checked='true'] { background: var(--tea-color-bg-brand-default); }
.switch[aria-checked='true']::after { transform: translateX(15px); }
.switch:disabled { opacity: .5; cursor: not-allowed; }

.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--tea-color-text-tertiary); font-size: 12px; padding: 10px 12px;
  border-bottom: 1px solid #cfd5de; background: #fff; white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--tea-color-border-secondary-default); vertical-align: top; }
.tbl tbody tr:hover td { background: #f7f9fc; }
.tbl tr.locked td { background: var(--tea-color-bg-secondary-default); color: var(--tea-color-text-secondary); }
.tbl tr.is-off td { color: var(--tea-color-text-tertiary); }
.actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.footnote { margin-top: 8px; font-size: 12px; color: var(--tea-color-text-secondary); }

.form { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px 20px; align-items: start; }
.form-label { padding-top: 6px; color: var(--tea-color-text-secondary); font-size: 13px; }
.form-label .req { color: var(--tea-color-text-error-default); margin-left: 2px; }
.form-ctrl { min-width: 0; }
.form-help { font-size: 12px; color: var(--tea-color-text-tertiary); margin-top: 4px; }
.form-msg { font-size: 12px; margin-top: 4px; }
.form-msg.err { color: var(--tea-color-text-error-default); }
.form-msg.warn { color: var(--tea-color-text-warning-default); }
.form-msg.ok { color: var(--tea-color-text-success-default); }
.input, .select { height: var(--tea-form-height-default); padding: 0 10px; border: 1px solid var(--tea-color-palette-bluegray-4);
  border-radius: 3px; background: #fff; font-size: 12px; width: 100%; max-width: 420px; }
.input:hover, .select:hover { border-color: #b7bfcc; }
.input:focus, .select:focus { border-color: var(--tea-color-border-brand-default); outline: none; box-shadow: 0 0 0 2px rgba(0,82,217,.15); }
.input.is-error { border-color: var(--tea-color-bg-error-default); }
.input:disabled, .select:disabled { background: var(--tea-color-bg-secondary-default); color: var(--tea-color-text-secondary); cursor: not-allowed; }
.radio-card:disabled { cursor: not-allowed; opacity: .75; }
.input[readonly] { background: var(--tea-color-bg-secondary-default); color: var(--tea-color-text-secondary); }
.input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--tea-color-palette-bluegray-4); border-radius: 3px; overflow: hidden; }
.seg button { height: 30px; padding: 0 16px; border: 0; background: #fff; cursor: pointer; font-size: 12px; border-right: 1px solid var(--tea-color-palette-bluegray-4); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed='true'] { background: var(--tea-color-bg-brand-lighten-default); color: var(--tea-color-text-brand-default); font-weight: 600; }
.radio-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; max-width: 720px; }
.radio-card { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid var(--tea-color-palette-bluegray-4); border-radius: 4px; cursor: pointer; background: #fff; text-align: left; }
.radio-card:hover { border-color: #b7bfcc; }
.radio-card[aria-checked='true'] { border-color: var(--tea-color-border-brand-default); background: #f5f8ff; }
.radio-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #b7bfcc; margin-top: 3px; flex-shrink: 0; position: relative; background: #fff; }
.radio-card[aria-checked='true'] .radio-dot { border-color: var(--tea-color-border-brand-default); }
.radio-card[aria-checked='true'] .radio-dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--tea-color-bg-brand-default); }
.radio-card b { display: block; font-size: 13px; }
.radio-card span { font-size: 12px; color: var(--tea-color-text-tertiary); }

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 28px; font-size: 13px; }
.check input { width: 14px; height: 14px; accent-color: var(--tea-color-bg-brand-default); margin: 0; }

/* Danh sách model trong form */
.ml { border: 1px solid var(--tea-color-border-primary-default); max-width: 760px; }
.ml-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--tea-color-border-primary-default); background: var(--tea-color-bg-secondary-default); flex-wrap: wrap; }
.ml-toolbar .input { max-width: 240px; }
.ml-count { margin-left: auto; font-size: 12px; color: var(--tea-color-text-secondary); }
.ml-body { max-height: 300px; overflow-y: auto; }
.ml-row { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--tea-color-border-secondary-default); min-height: 40px; }
.ml-row:last-child { border-bottom: 0; }
.ml-row:hover { background: #f7f9fc; }
.ml-id { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.ml-id .src { color: var(--tea-color-text-tertiary); }
.ml-empty { padding: 24px; text-align: center; color: var(--tea-color-text-tertiary); font-size: 13px; }
.spinner { width: 14px; height: 14px; border: 2px solid #bbd3fb; border-top-color: var(--tea-color-bg-brand-default); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Phân biệt trường mới và trường cũ trong form */
.tag-new { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 600;
  background: var(--tea-color-palette-orange-1); color: var(--tea-color-text-warning-default); border: 1px solid #ffd0a8; vertical-align: middle; }
.field-key { display: inline-block; font-family: var(--font-mono); font-size: 11px; color: var(--tea-color-text-tertiary); background: var(--tea-color-bg-secondary-default);
  padding: 0 4px; border-radius: 2px; vertical-align: middle; }
.form-label .field-key, .form-label .tag-new { margin-left: 4px; }
.form-section { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 8px 0 6px;
  border-bottom: 1px solid var(--tea-color-border-primary-default); margin-top: 8px; }
.form-section b { font-size: 13px; }
.form-section span:not(.tag-new) { font-size: 12px; color: var(--tea-color-text-tertiary); }
.form-ctrl.is-new { border-left: 3px solid #ffd0a8; padding-left: 12px; }
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; max-width: 760px; }
.agent-chip { display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border: 1px solid var(--tea-color-palette-bluegray-4); border-radius: 4px; cursor: pointer; font-size: 13px; }
.agent-chip input { margin-top: 3px; accent-color: var(--tea-color-bg-brand-default); }
.agent-chip span { display: flex; flex-direction: column; gap: 2px; }
.agent-chip.is-taken { background: var(--tea-color-bg-secondary-default); color: var(--tea-color-text-tertiary); cursor: not-allowed; }
.ml-row.is-gone .ml-id { color: var(--tea-color-text-tertiary); }
.pool-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pool-bar { position: relative; height: 8px; border-radius: 4px; background: var(--tea-color-bg-secondary-default); margin-top: 4px; }
.pool-bar i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: var(--tea-color-bg-success-default); }
.pool-bar i.warn { background: var(--tea-color-bg-warning-default); }

var MODES = {

/* Agent hỗ trợ (default-supported-agents.ts) sau thay đổi: thêm omp, bỏ pi (pi không còn được hỗ trợ). Chỉ omp, hermes, openclaw là multi_source. */

  { id: 'codebuddy', label: 'CodeBuddy' }, { id: 'workbuddy', label: 'WorkBuddy' },

];

var API_PROVIDERS = {
  openai:     { label: 'OpenAI', slug: 'openai', baseUrl: 'https://api.openai.com/v1', format: 'openai-responses',
                models: ['gpt-6-sol', 'gpt-6.1-sol', 'gpt-6-astra', 'gpt-6-mini', 'gpt-6-nano', 'o5-pro', 'gpt-image-3', 'text-embedding-4-large'] },

                models: ['deepseek-v4', 'deepseek-v4-flash', 'deepseek-v4-reasoner'] },
  openrouter: { label: 'OpenRouter', slug: 'openrouter', baseUrl: 'https://openrouter.ai/api/v1', format: 'openai-chat',
                models: ['deepseek-v4', 'qwen4-max', 'glm-5', 'kimi-k3', 'llama-5-70b', 'mistral-large-3', 'gemini-3-pro', 'claude-sonnet-5'] },

                models: ['kimi-k3', 'kimi-k3-turbo'] },
  custom:     { label: 'Khác (base URL riêng)', slug: 'custom', baseUrl: '', format: 'openai-chat',
                models: ['deepseek-v4', 'deepseek-v4-flash', 'qwen4-32b', 'glm-5-air'] }

}

var state = {
  view: 'list',            // list | form | pool | preview
  notes: true,
  role: 'admin',           // admin | member (giống readOnly = !isGlobalAdmin của trang Pool)
  previewAgent: 'omp',
  poolTab: 'claude',
  form: null,
  /* Nhóm upstream custom = dòng của tab Model Provider. source = null: nhóm cũ, chưa dùng làm nguồn. */
  groups: [
    { id: 'grp-openai', name: 'OpenAI key công ty', provider: 'openai', mode: 'custom_unified', baseUrl: API_PROVIDERS.openai.baseUrl,
      keySet: true, description: 'Key dùng chung của team', agents: [], modelId: '', enabled: true,
      source: { name: 'api-openai', formats: ['openai-responses'], agents: ['omp', 'hermes'], enabled: true, fetchedAt: '25/10 18:40', error: '',
        models: mk(API_PROVIDERS.openai.models, ['gpt-6-nano', 'o5-pro', 'gpt-image-3', 'text-embedding-4-large'])
          .concat([{ id: 'gpt-5.5', on: true, available: false }]) } },
    { id: 'grp-deepseek', name: 'DeepSeek', provider: 'deepseek', mode: 'custom_unified', baseUrl: API_PROVIDERS.deepseek.baseUrl,
      keySet: true, description: '', agents: ['dsh'], modelId: 'deepseek-v4', enabled: true,
      source: { name: 'api-deepseek', formats: ['openai-chat'], agents: ['omp', 'openclaw'], enabled: true, fetchedAt: '25/10 18:41', error: '',
        models: mk(API_PROVIDERS.deepseek.models, ['deepseek-v4-reasoner']) } },
    { id: 'grp-openrouter', name: 'OpenRouter', provider: 'openrouter', mode: 'custom_unified', baseUrl: API_PROVIDERS.openrouter.baseUrl,
      keySet: true, description: '', agents: [], modelId: '', enabled: true,
      source: { name: 'api-openrouter', formats: ['openai-chat'], agents: ['omp'], enabled: true, fetchedAt: '25/10 18:42', error: '',
        models: mk(API_PROVIDERS.openrouter.models, ['glm-5', 'kimi-k3', 'llama-5-70b', 'mistral-large-3', 'gemini-3-pro', 'claude-sonnet-5']) } },
    { id: 'grp-siliconflow', name: 'SiliconFlow', provider: 'custom', mode: 'custom_unified', baseUrl: 'https://api.siliconflow.cn/v1',
      keySet: true, description: '', agents: [], modelId: '', enabled: true,
      source: { name: 'api-siliconflow', formats: ['openai-chat'], agents: ['omp', 'hermes'], enabled: true, fetchedAt: '25/10 16:10',
        error: 'Lần lấy lúc 25/10 18:05 lỗi: HTTP 429 (quá giới hạn). Giữ danh sách cũ.',
        models: mk(API_PROVIDERS.custom.models, ['glm-5-air']) } },
    { id: 'grp-kimi', name: 'Kimi cho CodeBuddy', provider: 'moonshot', mode: 'custom_unified', baseUrl: API_PROVIDERS.moonshot.baseUrl,
      keySet: true, description: 'Nhóm tạo trước tính năng nguồn', agents: ['codebuddy', 'opencode'], modelId: 'kimi-k3', enabled: true, source: null },
    { id: 'grp-byok', name: 'Key riêng từng người', provider: 'custom', mode: 'custom_passthrough', baseUrl: 'https://api.anthropic.com',
      keySet: false, description: 'Người dùng tự gửi key Anthropic', agents: ['workbuddy'], modelId: '', enabled: true, source: null }
  ],
  /* Nhóm subscription_pool. Phần source sửa trên tab Pool; bật/tắt theo công tắc pool (không có source_enabled riêng). Codex chưa có nguồn: minh họa bước tạo tên. */
  pools: {
    claude: { label: 'Pool thuê bao Claude', tab: 'Claude Code', agent: 'claude-code', enabled: true, slug: 'claude', format: 'anthropic-messages',
      accounts: [
        { name: 'claude-team-01', label: 'Max 20x', state: 'active', p5h: 42, pw: 61 },
        { name: 'claude-team-02', label: 'Max 20x', state: 'near_limit', p5h: 88, pw: 74 },
        { name: 'claude-team-03', label: 'Max 5x', state: 'disabled', p5h: 0, pw: 12 }
      ],
      models: ['claude-opus-5-5', 'claude-sonnet-5', 'claude-haiku-5'],
      source: { name: 'sub-claude', formats: ['anthropic-messages'], agents: ['omp', 'hermes', 'openclaw'], fetchedAt: '25/10 18:30', error: '',
        models: mk(['claude-opus-5-5', 'claude-sonnet-5', 'claude-haiku-5']) } },
    codex: { label: 'Pool thuê bao ChatGPT / Codex', tab: 'Codex', agent: 'codex', enabled: true, slug: 'openai', format: 'openai-responses',
      accounts: [
        { name: 'chatgpt-pro-01', label: 'Pro', state: 'active', p5h: 23, pw: 40 },
        { name: 'chatgpt-pro-02', label: 'Pro', state: 'active', p5h: 57, pw: 66 }
      ],
      models: ['gpt-6-astra', 'gpt-6.1-sol', 'gpt-6-sol', 'gpt-6-mini'],
      source: null }
  }
};

/* ===================== Tiện ích ===================== */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function isAdmin() { return state.role === 'admin'; }
function findGroup(id) { return state.groups.find(function (g) { return g.id === id; }); }
function agentLabel(id) { var a = ALL_AGENTS.find(function (x) { return x.id === id; }); return a ? a.label : id; }
function onCount(models) { return models.filter(function (m) { return m.on && m.available; }).length; }
function availCount(models) { return models.filter(function (m) { return m.available; }).length; }
function NEW() { return ' <span class="tag-new" title="Trường mới thêm trên tính năng cũ">mới</span>'; }
function OLD(field) { return ' <span class="field-key">' + field + '</span>'; }
function fmtTags(formats) { return formats.map(function (f) { return '<span class="tag">' + FORMATS[f].label + '</span>'; }).join(''); }
function agentTags(list, cls) {
  if (!list.length) return '<span class="weak">—</span>';
  return '<div class="tags">' + list.map(function (a) { return '<span class="tag ' + (cls || 'tag-primary') + '">' + esc(a) + '</span>'; }).join('') + '</div>';
}

function toast(msg, warn) {
  var el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(function () { el.remove(); }, 3200);
}

/* Mọi tên nguồn đang dùng (nhóm custom + nhóm pool). */
function takenNames(exceptGroupId) {
  var out = [];
  state.groups.forEach(function (g) { if (g.source && g.id !== exceptGroupId) out.push(g.source.name); });
  Object.keys(state.pools).forEach(function (k) { if (state.pools[k].source) out.push(state.pools[k].source.name); });
  return out;
}
function suggestName(slug, exceptGroupId) {
  var base = 'api-' + slug, taken = takenNames(exceptGroupId);
  if (!taken.includes(base)) return base;
  var i = 2;
  while (taken.includes(base + '-' + i)) i++;
  return base + '-' + i;
}
/* Dạng: ^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$, duy nhất. */
function validateName(name, exceptGroupId) {
  if (!name) return { ok: false, msg: 'Bắt buộc nhập tên nguồn.' };
  if (name.length > 40) return { ok: false, msg: 'Tối đa 40 ký tự.' };
  if (/[A-Z]/.test(name)) return { ok: false, msg: 'Chỉ dùng chữ thường. Gợi ý: ' + name.toLowerCase() };
  if (!/^[a-z0-9-]+$/.test(name)) return { ok: false, msg: 'Chỉ được dùng a-z, 0-9 và dấu "-". Không dùng "/" vì "/" ngăn cách nguồn và model.' };
  if (/^-|-$/.test(name)) return { ok: false, msg: 'Không bắt đầu hoặc kết thúc bằng dấu "-".' };
  if (takenNames(exceptGroupId).includes(name)) return { ok: false, msg: 'Tên "' + name + '" đã có. Tên nguồn phải duy nhất.' };
  return { ok: true };
}

/* Agent ở đường "Dùng cho cả agent" chỉ thuộc một nhóm (agents_overlap). */
function agentOwner(agentId, exceptGroupId) {
  var g = state.groups.find(function (x) { return x.id !== exceptGroupId && x.agents.includes(agentId); });
  if (g) return g.name;
  var p = Object.keys(state.pools).find(function (k) { return state.pools[k].agent === agentId; });
  return p ? state.pools[p].label : null;
}

/* Danh sách /v1/models mà một agent multi_source sẽ thấy. */
function exposedFor(agent) {
  var out = [];
  Object.keys(state.pools).forEach(function (k) {
    var p = state.pools[k], s = p.source;
    if (!s || !p.enabled || !s.agents.includes(agent)) return;
    s.models.forEach(function (m) { if (m.on && m.available) out.push({ id: s.name + '/' + m.id, model: m.id, name: s.name, kind: 'sub', provider: p.label, formats: s.formats }); });
  });
  state.groups.forEach(function (g) {
    var s = g.source;
    if (!s || !s.enabled || g.mode !== 'custom_unified' || !s.agents.includes(agent)) return;
    s.models.forEach(function (m) { if (m.on && m.available) out.push({ id: s.name + '/' + m.id, model: m.id, name: s.name, kind: 'api', provider: API_PROVIDERS[g.provider].label, formats: s.formats }); });
  });
  return out;
}

function mockBar() {

    SCREENS.map(function (s) {

      '<button type="button" data-role="admin" aria-pressed="' + isAdmin() + '">Admin</button>' +

function syncShell() {
  var onPool = state.view === 'pool';
  $all('.sider [data-go]').forEach(function (b) {
    var sel = (b.dataset.go === 'pool') === onPool;
    b.classList.toggle('is-selected', sel);
    if (sel) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#tab-pool').classList.toggle('is-active', onPool);
  $('#tab-provider').classList.toggle('is-active', !onPool);
  $('#gh-user').innerHTML = isAdmin() ? '<span class="gh-avatar">K</span>kevin · System Admin' : '<span class="gh-avatar">A</span>an · Thành viên';
}

function pageHead() {
  var tab = state.view === 'preview' ? 'preview' : 'list';
  return '<div class="card"><div class="card-body">' +
    '<div class="page-head"><h3 class="page-title">Model Provider</h3>' +
    '<div class="seg" role="group" aria-label="Chế độ xem">' +
      '<button type="button" data-go="list" aria-pressed="' + (tab === 'list') + '">Danh sách provider</button>' +
      '<button type="button" data-go="preview" aria-pressed="' + (tab === 'preview') + '">Client sẽ thấy</button>' +
    '</div></div>' +
    '<div class="sec small" style="margin-top:8px">Instance "vtc-prod" · Quản lý nhóm upstream tùy chỉnh (API key). Mỗi nhóm có thể dùng cho cả agent (như hôm nay), ' +
    'dùng làm nguồn model <code>&lt;nguồn&gt;/&lt;model&gt;</code>, hoặc cả hai. Nguồn thuê bao ở tab Pool tài khoản thuê bao.</div>' +
    '</div></div>';
}

function render() {
  var html = mockBar();
  if (state.view === 'list') html += pageHead() + renderList();
  else if (state.view === 'form') html += renderForm();
  else if (state.view === 'pool') html += renderPool();
  else html += pageHead() + renderPreview();
  $('#app').innerHTML = html;
  syncShell();
  bindCommon();
  if (state.view === 'list') bindList();
  if (state.view === 'form') bindForm();
  if (state.view === 'pool') bindPool();
  if (state.view === 'preview') bindPreview();
}

function go(view) { state.view = view; state.form = null; activeScreen = view === 'pool' ? (state.poolTab === 'codex' ? 'pool-create' : 'pool') : view; closeDialog(); render(); }

function bindCommon() {
  $all('[data-screen]').forEach(function (b) { b.onclick = function () { goScreen(b.dataset.screen); }; });
  $all('#app [data-go]').forEach(function (b) { b.onclick = function (e) { e.preventDefault(); go(b.dataset.go); }; });
  $all('[data-role]').forEach(function (b) {
    b.onclick = function () {
      if (state.role === b.dataset.role) return;
      state.role = b.dataset.role;
      closeDialog();
      if (!isAdmin() && state.form) {
        // Thành viên: form thêm quay về danh sách; form sửa chuyển thành form xem.
        if (state.form.mode === 'add') { go('list'); return; }
        openEdit(state.form.groupId); return;
      }
      render();
    };
  });
  var tn = $('#toggle-notes');
  if (tn) tn.onchange = function () { state.notes = tn.checked; document.body.classList.toggle('hide-notes', !tn.checked); };
}

function goScreen(id) {
  if (!isAdmin() && ADMIN_SCREENS[id]) { toast('Chế độ chỉ đọc: chỉ System Admin thêm hoặc sửa provider.', true); return; }
  activeScreen = id;
  closeDialog();
  if (id === 'add') { openAdd(); state.form.key = 'sk-••••••••••••••••'; render(); fetchModels(); }
  else if (id === 'edit') openEdit('grp-openai');
  else if (id === 'attach') openEdit('grp-kimi', true);
  else if (id === 'pool' || id === 'pool-create') { state.view = 'pool'; state.form = null; state.poolTab = id === 'pool' ? 'claude' : 'codex'; poolSearch.q = ''; render(); }
  else { state.view = id; state.form = null; render(); }
}

function openAdd() {
  var p = API_PROVIDERS.openai;
  state.form = {
    mode: 'add', groupId: null, name: p.label, provider: 'openai', groupMode: 'custom_unified', baseUrl: p.baseUrl,
    key: '', keySet: false, description: '', agents: [], modelId: '', enabled: true,
    useSource: true, sourceSaved: false, sourceName: suggestName(p.slug, null), nameTouched: false,
    formats: [p.format], sourceAgents: MULTI_AGENTS.slice(), sourceEnabled: true,
    models: [], fetchState: 'idle', fetchedAt: '', error: '', search: ''
  };
  state.view = 'form';
  render();
}

function openEdit(id, attach) {
  var g = findGroup(id), s = g.source;
  var f = {
    mode: 'edit', groupId: g.id, attach: !!attach, name: g.name, provider: g.provider, groupMode: g.mode, baseUrl: g.baseUrl,
    key: '', keySet: g.keySet, description: g.description, agents: g.agents.slice(), modelId: g.modelId, enabled: g.enabled,
    useSource: !!s || !!attach, sourceSaved: !!s, nameTouched: false,
    sourceName: s ? s.name : suggestName(API_PROVIDERS[g.provider].slug, g.id),
    formats: s ? s.formats.slice() : [API_PROVIDERS[g.provider].format], sourceAgents: s ? s.agents.slice() : MULTI_AGENTS.slice(),
    sourceEnabled: s ? s.enabled : true,
    models: s ? s.models.map(function (m) { return { id: m.id, on: m.on, available: m.available }; }) : [],
    fetchState: s ? 'done' : 'idle', fetchedAt: s ? s.fetchedAt : '', error: s ? s.error : '', search: ''
  };
  state.form = f;
  state.view = 'form';
  render();
}

function needsKey(f) { return f.groupMode === 'custom_unified'; }
function sourceAllowed(f) { return f.groupMode === 'custom_unified'; }
function sourceOn(f) { return f.useSource && sourceAllowed(f); }

function formProblems(f) {
  var p = [];
  if (!f.name.trim()) p.push('Cần tên nhóm.');
  if (!f.baseUrl) p.push('Cần base URL.');
  if (needsKey(f) && !f.key && !f.keySet) p.push('Cần API key.');
  if (sourceOn(f)) {
    if (!f.sourceSaved && !validateName(f.sourceName, f.groupId).ok) p.push('Tên nguồn chưa hợp lệ.');
    if (!f.formats.length) p.push('Chọn ít nhất một định dạng.');
  }
  // Core: agents ≥ 1 hoặc (source_name khác rỗng và source_agents ≥ 1)
  if (!f.agents.length && !(sourceOn(f) && f.sourceAgents.length)) p.push('Chọn ít nhất một agent ở "Dùng cho cả agent" hoặc một agent ở "Dùng làm nguồn".');
  return p;
}

function row(label, ctrl, isNew) {
  return '<div class="form-label' + (isNew ? ' is-new' : '') + '">' + label + '</div><div class="form-ctrl' + (isNew ? ' is-new' : '') + '">' + ctrl + '</div>';
}
function section(title, sub) {
  return '<div class="form-section"><b>' + title + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</div>';
}

function nameMessage(f) {
  var v = validateName(f.sourceName, f.groupId);
  if (!v.ok) return { cls: 'err', text: v.msg };
  if (!f.nameTouched) return { cls: 'ok', text: 'Tên do hệ thống gợi ý từ nhà cung cấp. Có thể sửa trước khi lưu.' };
  return { cls: 'ok', text: 'Tên hợp lệ.' };
}

  if (ro) {
    html += row('API key' + OLD('api_key'), '<div style="min-height:30px;display:flex;align-items:center;gap:8px">' +
      (needsKey(f) ? '<span class="tag ' + (f.keySet ? 'tag-success' : 'tag-error') + '">' + (f.keySet ? 'Đã cấu hình' : 'Chưa có') + '</span><span class="weak small">Thành viên không thấy key.</span>'
        : '<span class="weak small">Không lưu key (custom_passthrough).</span>') + '</div>');
  } else if (needsKey(f)) {
    html += row('<label for="f-key">API key<span class="req">*</span></label>' + OLD('api_key'),
      '<input class="input mono" id="f-key" type="password" value="' + esc(f.key) + '" placeholder="' + (f.keySet ? 'Đã lưu (sk-••••…). Để trống nếu không đổi' : 'sk-••••') + '" autocomplete="off">' +
      '<div class="form-help">Lưu ở Core. Không action Panel nào trả key rõ.</div>');
  } else {
    html += row('API key' + OLD('api_key'), '<div class="alert alert-info" style="max-width:560px"><div>Ẩn ở chế độ <code>custom_passthrough</code>: nhóm không lưu key, proxy chuyển tiếp key do client gửi.</div></div>');
  }
  html += row('<label for="f-desc">Mô tả</label>' + OLD('description'), '<input class="input" id="f-desc" value="' + esc(f.description) + '" placeholder="Tùy chọn">');

  /* --- Dùng cho cả agent (cũ) --- */
  html += section('Dùng cho cả agent (hành vi cũ)', 'Mọi yêu cầu của agent được chọn đi qua nhóm này. Giữ nguyên như hôm nay.');
  html += row('Agent' + OLD('agents'), renderAgentPicker(f));
  html += row('<label for="f-modelid">Model cố định</label>' + OLD('model_id'),
    '<input class="input mono" id="f-modelid" value="' + esc(f.modelId) + '" placeholder="Để trống" style="max-width:280px" spellcheck="false">' +
    '<div class="form-help">Như hôm nay: khi đặt, proxy ghi đè model của mọi yêu cầu từ các agent ở trên. Không ảnh hưởng phần "Dùng làm nguồn".</div>');
  html += row('Trạng thái' + OLD('enabled'), '<div style="display:flex;align-items:center;gap:8px;min-height:30px">' +
    '<button type="button" class="switch" role="switch" id="f-enabled" aria-checked="' + f.enabled + '" aria-label="Bật nhóm cho các agent trên"></button><span>' + (f.enabled ? 'Bật cho các agent trên' : 'Tắt (agent nhận lỗi UPSTREAM_DISABLED)') + '</span></div>');

  /* --- Dùng làm nguồn (mới) --- */
  html += section('Dùng làm nguồn' + NEW(), 'omp, hermes, openclaw gọi model dạng &lt;nguồn&gt;/&lt;model&gt;. Proxy gửi id model thật, bỏ qua model_id.');
  if (!sourceAllowed(f)) {
    html += row('', '<div class="alert alert-warning" style="max-width:760px"><div><b>Không dùng được làm nguồn.</b> Nhóm <code>custom_passthrough</code> gửi key của client lên upstream; client nhiều nguồn gửi user key của proxy, không phải key nhà cung cấp, nên nhà cung cấp sẽ từ chối. Nhóm passthrough không có trường nguồn và không lấy model; Core trả <code>SOURCE_MODE_NOT_ALLOWED</code> nếu gửi trường nguồn.</div></div>', true);
  } else {
    if (!f.sourceSaved) {
      html += row('Dùng làm nguồn', '<div style="display:flex;align-items:center;gap:8px;min-height:30px">' +
        '<button type="button" class="switch" role="switch" id="f-use-source" aria-checked="' + f.useSource + '" aria-label="Dùng nhóm này làm nguồn"></button><span>' +
        (f.useSource ? 'Có' : 'Không (nhóm chỉ dùng cho agent ở trên)') + '</span></div>', true);
    }
    if (f.useSource) html += renderSourceFields(f, ro);
  }

  var problems = formProblems(f);
  return '<div class="card"><div class="card-body">' +
      '<div class="card-head"><div><button type="button" class="btn-link btn" data-go="list">‹ Model Provider</button>' +
      '<h3 class="page-title" style="margin-top:4px">' + title + '</h3>' +
      '<div class="card-sub">' + (ro ? 'Chế độ chỉ đọc: chỉ System Admin sửa được.' : f.attach ? 'Nhóm cũ đang chạy cho ' + (g.agents.join(', ') || 'không agent nào') + '. Thêm phần "Dùng làm nguồn" không đổi phần agent.' : 'Một nhóm upstream custom có thể dùng cho cả agent, làm nguồn, hoặc cả hai.') + '</div></div></div>' +
      (ro ? '<div class="alert alert-warning" style="margin-bottom:16px"><div>Chế độ chỉ đọc. Các ô bị khóa, không có nút lấy model hay lưu. Không hiện key.</div></div>' : '') +
      '<div class="legend"><span class="tag-new">mới</span> = trường thêm trên tính năng cũ. <span class="field-key">name</span> = tên trường trong Core.</div>' +
      '<div class="form">' + html + '</div>' +
      '<div class="note" style="margin-top:16px">Hai phần "Dùng cho cả agent" và "Dùng làm nguồn" là hai đường độc lập (agents + model_id + enabled cũ; source_agents + source_models + source_enabled mới). ' +
        'Một agent multi_source có thể ở cả hai. Đổi chế độ sang custom_passthrough để thấy phần nguồn bị tắt kèm nhãn "không dùng được làm nguồn".</div>' +
    '</div>' +
    (ro ? '<div class="form-footer"><button type="button" class="btn" data-go="list">Quay lại</button></div>'
      : '<div class="form-footer"><button type="button" class="btn btn-primary" id="f-save" ' + (problems.length ? 'disabled' : '') + '>' + (f.mode === 'add' ? 'Thêm provider' : 'Lưu thay đổi') + '</button>' +
        '<button type="button" class="btn" data-go="list">Hủy</button><span class="weak small" style="align-self:center" id="save-hint">' + esc(saveHint(f)) + '</span></div>') +
    '</div>';
}

function saveHint(f) {
  var p = formProblems(f);
  if (p.length) return p[0];
  var parts = [];
  if (f.agents.length) parts.push(f.agents.join(', ') + ' dùng nhóm như hôm nay');
  if (sourceOn(f)) parts.push(f.sourceAgents.join(', ') + ' thấy ' + onCount(f.models) + ' model ' + f.sourceName + '/*');
  return parts.join(' · ') + '.';
}

function renderAgentPicker(f) {
  var multi = { omp: 1, hermes: 1, openclaw: 1 };
  return '<div class="agent-grid">' + ALL_AGENTS.map(function (a) {
    var owner = agentOwner(a.id, f.groupId);
    var locked = a.id === 'claude-code' || a.id === 'codex';
    var on = f.agents.includes(a.id);
    return '<label class="agent-chip' + (owner && !on ? ' is-taken' : '') + '">' +
      '<input type="checkbox" data-agent="' + a.id + '" ' + (on ? 'checked' : '') + (owner && !on ? ' disabled' : '') + '> ' +
      '<span><b>' + a.label + '</b>' + (multi[a.id] ? ' <span class="tag tag-primary" style="height:18px">multi</span>' : '') +
      (owner && !on ? '<span class="weak small">' + (locked ? '🔒 ' + esc(owner) + ' — không đổi' : 'đang ở nhóm "' + esc(owner) + '"') + '</span>' : '') + '</span></label>';
  }).join('') + '</div><div class="form-help">Một agent chỉ ở một nhóm cho đường này (Core chặn trùng). Agent đã ở nhóm khác bị khóa.</div>';
}

function renderSourceFields(f, ro) {
  var html = '';
  if (f.sourceSaved || ro) {
    html += row('Tên nguồn' + OLD('source_name'),
      '<input class="input mono" id="f-name" value="' + esc(f.sourceName) + '" readonly style="max-width:280px">' +
      '<div class="form-help">Tên nằm trong model id của client nên không đổi được sau khi lưu. Muốn tên khác: tạo nhóm mới. Ví dụ model id: <code>' + esc(f.sourceName) + '/' + esc((f.models[0] && f.models[0].id) || 'model') + '</code></div>', true);
  } else {
    var nm = nameMessage(f), v = validateName(f.sourceName, f.groupId);
    html += row('<label for="f-name">Tên nguồn<span class="req">*</span></label>' + OLD('source_name'),
      '<div class="input-row"><input class="input mono' + (v.ok ? '' : ' is-error') + '" id="f-name" value="' + esc(f.sourceName) + '" autocomplete="off" spellcheck="false" aria-describedby="name-msg" style="max-width:280px">' +
      '<button type="button" class="btn btn-sm" id="f-name-reset" ' + (f.nameTouched ? '' : 'disabled') + '>Dùng tên gợi ý</button></div>' +
      '<div class="form-msg ' + nm.cls + '" id="name-msg">' + esc(nm.text) + '</div>' +
      '<div class="form-help">Chữ thường, a-z, 0-9, dấu "-". Duy nhất (kể cả sub-*). <b>Không đổi được sau khi lưu.</b> Ví dụ model id: <code id="name-example">' + esc(f.sourceName || '…') + '/' + esc((f.models[0] && f.models[0].id) || 'model') + '</code></div>', true);
  }
  html += row('Định dạng<span class="req">*</span>' + OLD('source_formats'),
    '<div class="tags" style="gap:12px">' + FORMAT_ORDER.map(function (k) {
      return '<label class="check"><input type="checkbox" data-format="' + k + '" ' + (f.formats.includes(k) ? 'checked' : '') + '> ' + FORMATS[k].label + '</label>';
    }).join('') + '</div><div class="form-help">Endpoint mà nhà cung cấp nhận. Client gọi sai định dạng sẽ nhận lỗi model_format_mismatch.</div>', true);
  html += row('Agent được dùng nguồn này' + OLD('source_agents'), renderSourceAgents(f.sourceAgents, f.models, f.sourceName, 'data-sagent'), true);
  html += row('Model bật' + OLD('source_models'), renderModelBlock(f, ro), true);
  html += row('Trạng thái nguồn' + OLD('source_enabled'), '<div style="display:flex;align-items:center;gap:8px;min-height:30px">' +
    '<button type="button" class="switch" role="switch" id="f-source-enabled" aria-checked="' + f.sourceEnabled + '" aria-label="Bật nguồn"></button><span>' +
    (f.sourceEnabled ? 'Bật (độc lập với công tắc của phần agent)' : 'Tắt: client không thấy model của nguồn này') + '</span></div>', true);
  return html;
}

function renderSourceAgents(list, models, name, attr) {
  var rows = MULTI_AGENTS.map(function (a) {
    var on = list.includes(a);
    return '<tr><td style="width:36px"><input type="checkbox" ' + attr + '="' + a + '" ' + (on ? 'checked' : '') + ' aria-label="Cho ' + a + ' dùng nguồn này" style="width:14px;height:14px;accent-color:#0052d9"></td>' +
      '<td><b>' + a + '</b></td><td><span class="tag tag-primary">multi_source</span></td>' +
      '<td class="sec small">' + (on ? 'Thấy ' + onCount(models) + ' model <code>' + esc(name || '…') + '/*</code>' : 'Không thấy nguồn này') + '</td></tr>';
  }).join('');
  var locked = LOCKED_AGENTS.map(function (a) {
    return '<tr class="locked"><td><span aria-hidden="true">🔒</span><span class="sr-only">Khóa</span></td><td><b>' + a.label + '</b></td>' +
      '<td><span class="tag">Một nhà cung cấp</span></td><td class="small">Chỉ dùng ' + state.pools[a.pool].label + ' — <b>không đổi</b></td></tr>';
  }).join('');
  return '<div class="table-wrap" style="max-width:760px;border:1px solid var(--tea-color-border-primary-default)"><table class="tbl"><thead><tr><th></th><th>Agent</th><th>Kiểu</th><th>Kết quả</th></tr></thead><tbody>' +
    rows + locked + '</tbody></table></div>';
}

function renderModelBlock(f, ro) {
  var head = '';
  if (!ro) {
    head = '<div class="input-row" style="margin-bottom:8px">' +
      '<button type="button" class="btn btn-primary" id="f-fetch" ' + (f.fetchState === 'loading' ? 'disabled' : '') + '>' +
      (f.fetchState === 'loading' ? '<span class="spinner" aria-hidden="true"></span> Đang lấy…' : (f.fetchState === 'done' ? 'Làm mới' : 'Lấy danh sách model')) + '</button>' +
      (f.fetchedAt ? '<span class="weak small">Lấy lúc ' + esc(f.fetchedAt) + ' · ' + availCount(f.models) + ' model</span>' : '') + '</div>';
  } else if (f.fetchedAt) {
    head = '<div class="weak small" style="margin-bottom:8px">Lấy lúc ' + esc(f.fetchedAt) + '</div>';
  }
  if (f.error) head += '<div class="alert alert-warning" style="margin-bottom:8px;max-width:760px"><div>' + esc(f.error) + '</div></div>';
  if (!f.models.length) {
    return head + '<div class="ml"><div class="ml-empty">' + (f.fetchState === 'loading' ? '<span class="spinner"></span> Đang hỏi ' + esc(f.baseUrl) + '/models …' : 'Chưa có danh sách. Điền base URL + API key rồi bấm "Lấy danh sách model". Model mới lấy về ở trạng thái tắt.') + '</div></div>';
  }
  return head + '<div class="ml" id="ml">' + renderModelList(f.models, f.search, f.sourceName, ro, 'checkbox') + '</div>';
}

/* Bảng model dùng chung cho form provider (checkbox) và phần nguồn của pool (switch). */
function renderModelList(models, search, name, ro, kind) {
  var q = (search || '').trim().toLowerCase();
  var visible = models.filter(function (m) { return !q || m.id.toLowerCase().includes(q); });
  var vAvail = visible.filter(function (m) { return m.available; });
  var allOn = vAvail.length > 0 && vAvail.every(function (m) { return m.on; });
  return '<div class="ml-toolbar">' +
      '<input class="input" id="f-search" type="search" placeholder="Tìm model…" value="' + esc(search || '') + '" aria-label="Tìm model">' +
      '<label class="check"><input type="checkbox" id="f-all" ' + (allOn ? 'checked' : '') + ' ' + (vAvail.length && !ro ? '' : 'disabled') + '> Chọn tất cả' + (q ? ' (kết quả lọc)' : '') + '</label>' +
      '<span class="ml-count">Đã bật <b>' + onCount(models) + '</b>/' + availCount(models) + '</span></div>' +
    '<div class="ml-body" role="list">' +
      (visible.length ? visible.map(function (m) {
        var dis = ro || !m.available;
        var control = kind === 'switch'
          ? '<button type="button" class="switch" role="switch" aria-checked="' + m.on + '" data-model="' + esc(m.id) + '" aria-label="Bật ' + esc(m.id) + '"' + (dis ? ' disabled' : '') + '></button>'
          : '<input type="checkbox" data-model="' + esc(m.id) + '" ' + (m.on ? 'checked' : '') + (dis ? ' disabled' : '') + ' aria-label="Bật ' + esc(m.id) + '" style="width:14px;height:14px;accent-color:#0052d9">';
        return '<div class="ml-row' + (m.available ? '' : ' is-gone') + '" role="listitem">' + (kind === 'switch' ? '<span></span>' : control) +
          '<div><div class="ml-id">' + esc(m.id) + (m.available ? '' : ' <span class="tag" style="height:18px">không còn ở nhà cung cấp</span>') + '</div>' +
          '<div class="ml-id"><span class="src">→ ' + esc(name || '…') + '/</span>' + esc(m.id) + '</div></div>' +
          (kind === 'switch' ? control : '<span class="tag ' + (m.on && m.available ? 'tag-success' : '') + '">' + (m.on && m.available ? 'Bật' : 'Tắt') + '</span>') + '</div>';
      }).join('') : '<div class="ml-empty">Không có model khớp "' + esc(search) + '".</div>') +
    '</div>';
}

function bindForm() {
  var f = state.form;
  if (!isAdmin()) {
    $all('#app .form input, #app .form select, #app .form .radio-card, #app .form .switch').forEach(function (el) { if (el.id !== 'f-search') el.disabled = true; });
    bindModelSearch(f, function () { return renderModelList(f.models, f.search, f.sourceName, true, 'checkbox'); });
    return;
  }
  $all('[data-mode]').forEach(function (b) { b.onclick = function () { f.groupMode = b.dataset.mode; render(); }; });
  var prov = $('#f-provider');
  prov.onchange = function () {
    var oldLabel = API_PROVIDERS[f.provider].label;
    f.provider = prov.value;
    var p = API_PROVIDERS[f.provider];
    if (f.mode === 'add') { f.baseUrl = p.baseUrl; f.formats = [p.format]; f.models = []; f.fetchState = 'idle'; f.fetchedAt = ''; f.error = ''; }
    if (!f.name || f.name === oldLabel) f.name = p.label;
    if (!f.sourceSaved && !f.nameTouched) f.sourceName = suggestName(p.slug, f.groupId);
    render();
  };
  function bindText(id, key, trim) { var el = $(id); if (el) el.oninput = function () { f[key] = trim ? el.value.trim() : el.value; refreshSave(); }; }
  bindText('#f-group', 'name'); bindText('#f-base', 'baseUrl', true); bindText('#f-key', 'key'); bindText('#f-desc', 'description'); bindText('#f-modelid', 'modelId', true);
  $all('[data-agent]').forEach(function (c) {
    c.onchange = function () {
      if (c.checked) f.agents.push(c.dataset.agent); else f.agents = f.agents.filter(function (a) { return a !== c.dataset.agent; });
      refreshSave();
    };
  });
  $('#f-enabled').onclick = function () { f.enabled = !f.enabled; render(); };
  var use = $('#f-use-source');
  if (use) use.onclick = function () { f.useSource = !f.useSource; render(); };
  var name = $('#f-name');
  if (name && !f.sourceSaved) name.oninput = function () { f.sourceName = name.value; f.nameTouched = true; refreshNameUi(); };
  var reset = $('#f-name-reset');
  if (reset) reset.onclick = function () { f.nameTouched = false; f.sourceName = suggestName(API_PROVIDERS[f.provider].slug, f.groupId); render(); };
  $all('[data-format]').forEach(function (c) {
    c.onchange = function () {
      if (c.checked) f.formats.push(c.dataset.format); else f.formats = f.formats.filter(function (x) { return x !== c.dataset.format; });
      refreshSave();
    };
  });
  $all('[data-sagent]').forEach(function (c) {
    c.onchange = function () {
      if (c.checked) f.sourceAgents.push(c.dataset.sagent); else f.sourceAgents = f.sourceAgents.filter(function (a) { return a !== c.dataset.sagent; });
      render();
    };
  });
  var se = $('#f-source-enabled');
  if (se) se.onclick = function () { f.sourceEnabled = !f.sourceEnabled; render(); };
  var fetchBtn = $('#f-fetch');
  if (fetchBtn) fetchBtn.onclick = fetchModels;
  bindModelList(f.models, f, function () { return renderModelList(f.models, f.search, f.sourceName, false, 'checkbox'); }, refreshSave);
  $('#f-save').onclick = commitForm;
}

function refreshNameUi() {
  var f = state.form, nm = nameMessage(f);
  $('#f-name').classList.toggle('is-error', nm.cls === 'err');
  var msg = $('#name-msg'); msg.className = 'form-msg ' + nm.cls; msg.textContent = nm.text;
  var reset = $('#f-name-reset'); if (reset) reset.disabled = false;
  var ex = $('#name-example'); if (ex) ex.textContent = (f.sourceName || '…') + '/' + ((f.models[0] && f.models[0].id) || 'model');
  $all('.ml-id .src').forEach(function (el) { el.textContent = '→ ' + (f.sourceName || '…') + '/'; });
  refreshSave();
}

function refreshSave() {
  var f = state.form, btn = $('#f-save');
  if (!btn) return;
  btn.disabled = formProblems(f).length > 0;
  $('#save-hint').textContent = saveHint(f);
}

/* Ô tìm trong bảng model: giữ con trỏ khi vẽ lại. */
function bindModelSearch(holder, draw, after) {
  var search = $('#f-search');
  if (!search) return;
  search.oninput = function () {
    holder.search = search.value;
    $('#ml').innerHTML = draw();
    if (after) after(); else bindModelSearch(holder, draw);
    var s = $('#f-search'); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  };
}

function bindModelList(models, holder, draw, onChange) {
  function rebind() { bindModelList(models, holder, draw, onChange); }
  bindModelSearch(holder, draw, rebind);
  var all = $('#f-all');
  if (all) all.onchange = function (e) {
    var q = (holder.search || '').trim().toLowerCase();
    models.forEach(function (m) { if (m.available && (!q || m.id.toLowerCase().includes(q))) m.on = e.target.checked; });
    $('#ml').innerHTML = draw(); rebind(); if (onChange) onChange();
  };
  $all('#ml [data-model]').forEach(function (el) {
    el.onclick = function () {
      var m = models.find(function (x) { return x.id === el.dataset.model; });
      m.on = !m.on;
      $('#ml').innerHTML = draw(); rebind(); if (onChange) onChange();
    };
  });
}

/* Giả lập Core groups/source-refresh: GET {baseUrl}/models bằng key của nhóm. */
function fetchModels() {
  var f = state.form;
  if (!f) return;
  f.error = '';
  if (!/^https?:\/\/[^\s/]+/.test(f.baseUrl || '')) { f.error = 'Base URL không hợp lệ. Ví dụ: https://example-provider.internal/v1'; render(); return; }
  if (!f.key && !f.keySet) { f.error = 'Cần nhập API key trước khi lấy danh sách model.'; render(); return; }
  f.fetchState = 'loading';
  render();
  setTimeout(function () {
    if (state.form !== f) return;
    var prev = {};
    f.models.forEach(function (m) { prev[m.id] = m.on; });
    var ids = API_PROVIDERS[f.provider].models;
    // Model mới: tắt. Model đã có: giữ lựa chọn. Model biến mất: available=false, giữ lựa chọn.
    var next = ids.map(function (id) { return { id: id, on: prev[id] === true, available: true }; });
    f.models.forEach(function (m) { if (!ids.includes(m.id)) next.push({ id: m.id, on: m.on, available: false }); });
    f.models = next;
    f.fetchState = 'done';
    f.fetchedAt = '25/10 19:05';
    render();
    toast('Đã lấy ' + ids.length + ' model từ ' + API_PROVIDERS[f.provider].label + '.');
  }, 900);
}

function commitForm() {
  var f = state.form;
  var source = sourceOn(f) ? { name: f.sourceName, formats: f.formats.slice(), agents: f.sourceAgents.slice(), enabled: f.sourceEnabled,

    agents: f.agents.slice(), modelId: f.modelId, enabled: f.enabled, source: source };

}

function bindPool() {

  function draw() { return renderModelList(holder.models, poolSearch.q, holder.name, !admin, 'switch'); }
  if (!admin) { $all('[data-pool-sagent]').forEach(function (c) { c.disabled = true; }); if (holder) bindModelSearch(poolSearch, draw); return; }
  $('[data-pool-switch]').onclick = function () { showPoolSwitchDialog(k); };
  $all('[data-pool-add], [data-pool-noop]').forEach(function (b) { b.onclick = function () { toast('Phần tài khoản giữ nguyên như trang hiện có.'); }; });

function ompYaml() {
  var list = exposedFor('omp');
  var lines = ['# Sinh bởi setup-proxy --agent omp. Không sửa tay các provider memory-*.', 'providers:'];
  FORMAT_ORDER.forEach(function (fmt) {
    var items = list.filter(function (x) { return x.formats[0] === fmt; });
    if (!items.length) return;
    var F = FORMATS[fmt];
    lines.push('  ' + F.omp + ':', '    api: ' + (fmt === 'openai-chat' ? 'openai-completions' : fmt),
      '    baseUrl: https://memory-proxy.example.internal' + F.path, '    apiKey: sk-••••', '    headers:',
      '      x-team-id: <team-id>', '      x-agent-id: <agent-id>', '    compat:', '      supportsPromptCacheKey: true', '    models:');
    items.forEach(function (x) { lines.push('      - id: ' + x.id); });
  });
  if (lines.length === 2) lines.push('  {}  # không có model nào cho omp');
  return lines.join('\n');
}

function highlightYaml(text) {
  return text.split('\n').map(function (line) {
    var e = esc(line);
    if (/^\s*#/.test(line)) return '<span class="c">' + e + '</span>';
    return e.replace(/^(\s*-?\s*)([A-Za-z][\w.-]*):(\s.*)?$/, function (_, pre, k, rest) {
      return pre + '<span class="k">' + k + '</span>:' + (rest ? '<span class="v">' + rest + '</span>' : '');
    });
  }).join('\n');
}

function copyText(text) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    toast(ok ? 'Đã sao chép models.yml.' : 'Trình duyệt chặn sao chép. Hãy chọn văn bản và nhấn Ctrl/Cmd+C.', !ok);
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Đã sao chép models.yml.'); }, fallback);
  else fallback();
}

function bindPreview() {
  $all('[data-agent-tab]').forEach(function (b) { b.onclick = function () { state.previewAgent = b.dataset.agentTab; render(); }; });
  var c = $('#copy-yml');
  if (c) c.onclick = function () { copyText(ompYaml()); };
}

/* ===================== Hộp thoại ===================== */
function openDialog(html, onReady) {
  var root = $('#dialog-root');
  root.innerHTML = '<div class="mask" id="mask"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">' + html + '</div></div>';
  var mask = $('#mask');
  mask.onclick = function (e) { if (e.target === mask) closeDialog(); };
  document.addEventListener('keydown', escClose);
  if (onReady) onReady(root);
  var first = root.querySelector('[data-autofocus]') || root.querySelector('button');
  if (first) first.focus();
}
function escClose(e) { if (e.key === 'Escape') closeDialog(); }
function closeDialog() { $('#dialog-root').innerHTML = ''; document.removeEventListener('keydown', escClose); }

function showDeleteDialog(id) {
  var g = findGroup(id), s = g.source;
  openDialog(
    '<h2 class="dialog-title" id="dlg-title">Xóa provider</h2>' +
    '<p><b>Xóa nhóm "' + esc(g.name) + '"?</b> Key đã lưu cũng bị xóa.</p>' +
    (g.agents.length ? '<p>Agent dùng nhóm như hôm nay sẽ nhận lỗi: ' + agentTags(g.agents) + '</p>' : '') +
    (s ? '<p>' + onCount(s.models) + ' model <code>' + esc(s.name) + '/*</code> biến mất khỏi danh sách của: ' + agentTags(s.agents) + '</p>' : '') +
    '<p class="weak small">Cấu hình client đang dùng các model này sẽ báo lỗi model không tồn tại. Muốn dừng tạm, hãy tắt công tắc.</p>' +
    '<div class="dialog-footer"><button type="button" class="btn btn-danger" id="dlg-ok">Xóa</button><button type="button" class="btn" id="dlg-cancel" data-autofocus>Hủy</button></div>',
    function () {
      $('#dlg-ok').onclick = function () { state.groups = state.groups.filter(function (x) { return x.id !== id; }); closeDialog(); toast('Đã xóa "' + g.name + '".', true); render(); };
      $('#dlg-cancel').onclick = closeDialog;
    });
}

/* Mở thẳng một màn bằng hash: index.html#1 … index.html#7 */
$all('.sider [data-go]').forEach(function (b) { b.onclick = function () { go(b.dataset.go); }; });
var startScreen = SCREENS[parseInt(location.hash.slice(1), 10) - 1];
if (startScreen) goScreen(startScreen.id); else render();
</script>
