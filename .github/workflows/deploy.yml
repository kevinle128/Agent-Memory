name: Build and deploy

# Each push to master builds the three images, pushes them to GHCR with the short
# commit as tag, and deploys that tag to the Komodo stack agent-memory on the VTC
# server. The deploy job runs on a self-hosted runner on that server, because the
# Komodo API listens only on the server (localhost:9120).

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Komodo after the build
        type: boolean
        default: true

concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.rev.outputs.revision }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: core
            context: ./MemoryCore
            dockerfile: ./MemoryCore/Dockerfile
          - service: hub
            context: .
            dockerfile: ./deploy/compose/Hub.Dockerfile
          - service: proxy
            context: ./MemoryProxy
            dockerfile: ./deploy/compose/Proxy.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - id: rev
        run: echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-memory-${{ matrix.service }}:${{ steps.rev.outputs.revision }}
            ghcr.io/${{ github.repository_owner }}/agent-memory-${{ matrix.service }}:master
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Komodo
    needs: build
    if: github.event_name == 'push' || inputs.deploy
    runs-on: [self-hosted, agent-memory-deploy]
    env:
      KOMODO_URL: http://localhost:9120
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
      REVISION: ${{ needs.build.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/komodo
      - name: Deploy the new revision
        run: python3 deploy/komodo/deploy-revision.py agent-memory AGENT_MEMORY_MEMORY_BUILD_REVISION "$REVISION"
