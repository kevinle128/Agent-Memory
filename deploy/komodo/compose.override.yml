# Komodo override for the VTC dev server. Komodo runs compose.yaml with this file.
# GitHub Actions (.github/workflows/deploy.yml) builds the three images on each push
# to master and pushes them to GHCR. The stack pulls the image whose tag is
# MEMORY_BUILD_REVISION (the short commit), so the stack never builds on the server.
#
# Komodo cannot read server-only files, so the values that compose.yaml reads from
# the optional env files next to core.yaml come from the stack environment here:
# Langfuse tracing for Core LLM calls, and the Google OAuth app of AntiGravity
# (without it AntiGravity pool accounts cannot sign in).
services:
  memory-core:
    image: ghcr.io/kevinle128/agent-memory-core:${MEMORY_BUILD_REVISION:?set MEMORY_BUILD_REVISION}
    pull_policy: missing
    environment:
      LANGFUSE_ENABLED: ${CORE_LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:-}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:-}
      # Reasoning models on VTC need > 4096 output tokens so L1/L3 JSON is not cut off.
      TDAI_LLM_MAX_TOKENS: ${MEMORY_LLM_MAX_TOKENS:-32768}
  memory-hub:
    image: ghcr.io/kevinle128/agent-memory-hub:${MEMORY_BUILD_REVISION:?set MEMORY_BUILD_REVISION}
    pull_policy: missing
  proxy:
    image: ghcr.io/kevinle128/agent-memory-proxy:${MEMORY_BUILD_REVISION:?set MEMORY_BUILD_REVISION}
    pull_policy: missing
